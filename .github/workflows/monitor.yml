name: Monitor Proposições CMRJ

env:
  TZ: America/Sao_Paulo

on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Dias recentes para considerar no envio"
        required: false
        default: "10"
      ignore_state:
        description: "Ignorar estado salvo e reenviar o período (1=sim)"
        required: false
        default: ""
      safe_validation:
        description: "Validar fonte sem email, Radar 03 ou alteração de estado (1=sim)"
        required: false
        default: ""
      backfill_all_pages:
        description: "Paginar todo o ano corrente (1=sim)"
        required: false
        default: ""
      queue_backfill:
        description: "Sincronizar somente fila interna, sem email (1=sim)"
        required: false
        default: ""

concurrency:
  group: monitor-proposicoes-cmrj
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: [self-hosted, Linux, X64, cmrj]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Checar calendário operacional
        id: calendario
        run: node scripts/should-run.js

      - name: Restaurar estado salvo
        if: steps.calendario.outputs.skip != 'true'
        run: |
          if [ ! -f estado.json ]; then
            echo '{"proposicoes_vistas":[],"ultima_execucao":""}' > estado.json
          fi

      - name: Executar monitor
        if: steps.calendario.outputs.skip != 'true'
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          CONTROLE03_API_USER: ${{ secrets.CONTROLE03_API_USER }}
          CONTROLE03_API_PASS: ${{ secrets.CONTROLE03_API_PASS }}
          CONTROLE03_STATE_URL: ${{ secrets.CONTROLE03_STATE_URL }}
          FIRJAN_EMAIL_DISABLED: "1"
          MONITOR_USER: ${{ secrets.MONITOR_USER }}
          MONITOR_PASS: ${{ secrets.MONITOR_PASS }}
          FIRJAN_CLIENTE_ID: "57"
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_all_pages == '1' && '365' || github.event.inputs.backfill_days || '10' }}
          IGNORE_STATE: ${{ github.event.inputs.ignore_state }}
          BACKFILL_ALL_PAGES: ${{ github.event.inputs.backfill_all_pages }}
          SYNC_RADAR03_ONLY: ${{ github.event.inputs.queue_backfill }}
          EXPORT_NOVAS_NO_EMAIL: ${{ (github.event.inputs.safe_validation == '1' || github.event.inputs.queue_backfill == '1') && '1' || '' }}
          NO_STATE_UPDATE: ${{ (github.event.inputs.safe_validation == '1' && github.event.inputs.queue_backfill != '1') && '1' || '' }}
        run: |
          export NODE_TLS_REJECT_UNAUTHORIZED=0
          node monitor.js

      - name: Salvar estado no repositório
        if: steps.calendario.outputs.skip != 'true' && (github.event.inputs.safe_validation != '1' || github.event.inputs.queue_backfill == '1')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git diff --staged --quiet || git commit -m "chore: atualiza estado [skip ci]"
          git pull --rebase origin main
          git push
